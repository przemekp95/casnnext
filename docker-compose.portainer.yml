version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: casn-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: casn
      MYSQL_USER: casn_user
      MYSQL_PASSWORD: casn_password123
      TZ: Europe/Warsaw
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker-init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro  # PRE-POPULATED DB
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - casn-network

  app:
    image: ghcr.io/przemekp95/casnnext:main
    container_name: casn-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "80"
      DATABASE_URL: "mysql://casn_user:casn_password123@mysql:3306/casn"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: casn_user
      DB_PASSWORD: casn_password123
      DB_NAME: casn
      NEXTAUTH_SECRET: "your-secret-key-here"
      NEXTAUTH_URL: "https://casn.tojest.dev"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Europe/Warsaw
      SKIP_PRISMA_MIGRATE: "1"  # Skip migrations since we have pre-populated DB
    # Run the package.json start script directly as a single command
    command: ["sh", "-c", "npm run start"]
    ports:
      - "18080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - casn-network

volumes:
  mysql_data:

networks:
  casn-network:
    driver: bridge