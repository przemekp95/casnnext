version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: casn-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: casn
      MYSQL_USER: casn_user
      MYSQL_PASSWORD: casn_password123
      TZ: Europe/Warsaw
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - casn-network

  strapi:
    build:
      context: ./strapi
    container_name: casn-strapi
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "1337"
      DATABASE_CLIENT: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: casn
      DATABASE_USERNAME: casn_user
      DATABASE_PASSWORD: casn_password123
      STRAPI_URL: "https://casn.pl/cms"
      APP_KEYS: "app-key-1,app-key-2,app-key-3,app-key-4"
      API_TOKEN_SALT: "api-token-salt-change-me"
      ADMIN_JWT_SECRET: "admin-jwt-secret-change-me"
      TRANSFER_TOKEN_SALT: "transfer-token-salt-change-me"
      JWT_SECRET: "jwt-secret-change-me"
      TZ: Europe/Warsaw
    volumes:
      - strapi_uploads:/opt/strapi/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1337/admin >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - casn-network

  app:
    image: ghcr.io/przemekp95/casnnext:main
    container_name: casn-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      strapi:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"

      # === TypeORM ===
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: casn_user
      DB_PASSWORD: casn_password123
      DB_NAME: casn
      CONTENT_PROVIDER: "${CONTENT_PROVIDER:-legacy}"
      STRAPI_INTERNAL_URL: "http://strapi:1337"
      NEXT_PUBLIC_STRAPI_URL: "${NEXT_PUBLIC_STRAPI_URL:-https://casn.pl/cms}"
      STRAPI_API_TOKEN: "${STRAPI_API_TOKEN:-}"
      STRAPI_WEBHOOK_SECRET: "${STRAPI_WEBHOOK_SECRET:-change-me}"
      REVALIDATE_SECRET: "${REVALIDATE_SECRET:-change-me}"

      # DB pool (critical)
      DB_POOL_SIZE: "5"

      # Next / Auth
      NEXTAUTH_SECRET: "your-secret-key-here"
      NEXTAUTH_URL: "https://casn.pl"
      NEXT_TELEMETRY_DISABLED: "1"

      TZ: Europe/Warsaw

      # Aplikacyjne
      APP_ROOT: "/app"
    command: ["npm", "start"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - casn-network

  nginx:
    image: nginx:1.27-alpine
    container_name: casn-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      strapi:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "18080:80"
    networks:
      - casn-network

volumes:
  mysql_data:
  strapi_uploads:

networks:
  casn-network:
    driver: bridge
