# Simplified Docker Compose - No Separate Migration Service
# Consolidates MySQL + Application into single service

version: "3.8"

services:
  mysql-casn:
    image: mysql:8.0
    container_name: casn-mysql-app
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: casn
      MYSQL_USER: casn_user
      MYSQL_PASSWORD: casn_password123
      TZ: Europe/Warsaw
    volumes:
      - mysql_data:/var/lib/mysql
      - ./casn.sql:/docker-entrypoint-initdb.d/casn.sql:ro
    command: >
      sh -lc '
        echo "Starting MySQL and application...";
        mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci;
      '
    ports:
      - "3306:3306"  # MySQL
      - "3000:3000"  # Next.js App
    networks:
      - casn-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mysql-casn:
        condition: service_healthy

  app:
    build: .
    container_name: casn-app-simple
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "mysql://casn_user:casn_password123@mysql-casn:3306/casn"
      DB_HOST: mysql-casn
      DB_PORT: "3306"
      DB_USER: casn_user
      DB_PASSWORD: casn_password123
      DB_NAME: casn
      NEXTAUTH_SECRET: "your-secret-key-here"
      NEXTAUTH_URL: "http://localhost:3000"
      TZ: Europe/Warsaw
    networks:
      - casn-network
    volumes:
      - ./public:/app/public:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      timeout: 10s
      retries: 3
      interval: 30s

volumes:
  mysql_data:

networks:
  casn-network:
    driver: bridge