name: "Quality Checks"
description: "Run linting, type checking, and code quality checks"

runs:
  using: "composite"
  steps:
    - name: Lint and quality policy
      run: |
        npm run lint
        npm run quality:policy
      shell: bash

    - name: Type check
      run: npm run type-check
      shell: bash

    - name: Check posts
      run: npm run check:posts
      shell: bash

    - name: Check CMS MDX media paths
      run: npm run check:cms-mdx-media
      shell: bash

    - name: Enforce production Compose policy
      run: npm run compose:policy
      shell: bash

    - name: Enforce immutable deployment artifact policy
      run: npm run deploy:policy
      shell: bash

    - name: Enforce dependency audit policy
      run: npm run audit:policy
      shell: bash
      env:
        AUDIT_FAIL_ON_APP: high
