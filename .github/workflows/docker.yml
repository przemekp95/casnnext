name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  mysql-setup:
    uses: ./.github/workflows/mysql-service.yml
    with:
      mysql-version: '8.4'
      database-name: 'casn_test'
      root-password: 'rootpassword'
      user-name: 'casn_user'
      user-password: 'casn_password'

  test:
    runs-on: ubuntu-latest
    needs: mysql-setup
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
        with:
          node-version: '20'

      - name: Setup database
        uses: ./.github/workflows/setup-database
        with:
          database-url: mysql://root:rootpassword@localhost:3306/casn_test

      - name: Run quality checks
        uses: ./.github/workflows/quality-checks

      - name: Run unit tests with coverage
        run: npm run test:ci -- --coverage --watchAll=false
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build for E2E tests
        run: npm run build
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test

      - name: Run E2E tests
        run: |
          # Start Next.js server in background
          npm run start &
          SERVER_PID=$!

          # Wait for server to be ready (longer timeout)
          echo "Waiting for server to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:3000/api/health; do echo "Server not ready, waiting..."; sleep 3; done'
          echo "Server is ready!"

          # Give server a moment to fully initialize
          sleep 5

          # Verify server is still responding
          curl -f http://localhost:3000/api/health || (echo "Server health check failed" && exit 1)

          # Run E2E tests
          echo "Starting E2E tests..."
          npm run test:e2e

          # Clean up server
          echo "Cleaning up server..."
          kill $SERVER_PID || true
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test
          PORT: 3000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: |
            coverage/
            cypress/videos/
            cypress/screenshots/
          retention-days: 30

      - name: Comment PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let coverage = 'Not available';
            let coverageStatus = 'Unknown';

            if (fs.existsSync('coverage/coverage-summary.json')) {
              const coverageData = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              coverage = `${coverageData.total.lines.pct}%`;
              coverageStatus = coverageData.total.lines.pct >= 80 ? 'Good' : 'Low';
            }

            const jobStatus = '${{ job.status }}';
            const unitTests = jobStatus === 'success' ? 'Passed' : 'Failed';
            const e2eTests = jobStatus === 'success' ? 'Passed' : 'Failed';
            const qualityChecks = jobStatus === 'success' ? 'Passed' : 'Failed';

            const body = `## Test Results

            **Coverage:** ${coverageStatus} (${coverage})
            **Unit Tests:** ${unitTests}
            **E2E Tests:** ${e2eTests}
            **Quality Checks:** ${qualityChecks}

            ---
            *Generated by CI/CD Pipeline*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: pr-${{ github.event.number }}

      - name: Build and push Docker image (main/tag)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}