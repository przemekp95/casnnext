name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]

env:
  REGISTRY: ghcr.io
  APP_IMAGE_NAME: ${{ github.repository }}
  NGINX_IMAGE_NAME: ${{ github.repository_owner }}/casn-nginx
  COVERAGE_MIN_LINES: '70'
  COVERAGE_EXCELLENT_LINES: '80'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: casn_test
          MYSQL_USER: casn_user
          MYSQL_PASSWORD: casn_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Clear TypeScript cache
        run: rm -rf node_modules/.cache tsconfig.tsbuildinfo tsconfig.ci.tsbuildinfo

      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"3306" --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL is ready!"

      - name: Run database migrations
        run: npm run migration:run
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test
          RUN_DB_MIGRATIONS: "1"
          DB_MIGRATION_CONFIRM: RUN_CASN_MIGRATIONS

      - name: Type check
        run: npm run type-check

      - name: Lint code
        run: npm run lint

      - name: Enforce quality debt policy
        run: npm run quality:policy

      - name: Check posts
        run: npm run check:posts

      - name: Check CMS MDX media paths
        run: npm run check:cms-mdx-media

      - name: Enforce dependency audit policy
        run: npm run audit:policy
        env:
          AUDIT_FAIL_ON_APP: high
          AUDIT_SUMMARY_FILE: ${{ github.step_summary }}

      - name: Run unit tests with coverage
        run: npm run test:ci -- --coverage --watchAll=false
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test

      - name: Upload coverage reports
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build for E2E tests
        run: npm run build
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test

      - name: Run comprehensive integration tests
        run: |
          # Start Next.js server in background
          npm run start &
          SERVER_PID=$!

          # Wait for server to be ready (longer timeout)
          echo "Waiting for server to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:3000/api/health; do echo "Server not ready, waiting..."; sleep 3; done'
          echo "Server is ready!"

          # Give server a moment to fully initialize
          sleep 5

          # Verify server is still responding
          curl -f http://localhost:3000/api/health || (echo "Server health check failed" && exit 1)

          # Run live integration tests (DB + Next server)
          echo "Running live integration tests..."
          npm run test:integration:live

          # Run E2E tests including hydration tests
          echo "Starting E2E tests with hydration..."
          npm run test:e2e

          # Clean up server
          echo "Cleaning up server..."
          kill $SERVER_PID || true
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test
          PORT: 3000
          RUN_LIVE_TESTS: "1"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: |
            coverage/
            cypress/videos/
            cypress/screenshots/
          retention-days: 30

      - name: Comment PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const minCoverage = Number(process.env.COVERAGE_MIN_LINES || '70');
            const excellentCoverage = Number(process.env.COVERAGE_EXCELLENT_LINES || '80');

            let coverage = 'Not available';
            let coverageStatus = 'Unknown';

            if (fs.existsSync('coverage/coverage-summary.json')) {
              const coverageData = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const linesPct = Number(coverageData.total.lines.pct);

              coverage = `${linesPct}%`;
              coverageStatus =
                linesPct >= excellentCoverage
                  ? 'Excellent'
                  : linesPct >= minCoverage
                    ? 'Good'
                    : 'Low';
            }

            const jobStatus = '${{ job.status }}';
            const unitTests = jobStatus === 'success' ? 'Passed' : 'Failed';
            const e2eTests = jobStatus === 'success' ? 'Passed' : 'Failed';
            const qualityChecks = jobStatus === 'success' ? 'Passed' : 'Failed';

            const body = `## Test Results

            **Coverage:** ${coverageStatus} (${coverage})
            **Coverage Policy:** Good >= ${minCoverage}% | Excellent >= ${excellentCoverage}%
            **Unit Tests:** ${unitTests}
            **E2E Tests:** ${e2eTests}
            **Quality Checks:** ${qualityChecks}

            ---
            *Generated by CI/CD Pipeline*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  directus-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Directus smoke tests
        run: npm run directus:smoke
        env:
          DIRECTUS_IMAGE: directus/directus:12.3.1@sha256:8978edf633ae28aa31464bb71c55300c94d8bc771ff3727b5fac485173283869

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, directus-smoke]
    permissions:
      contents: read
      packages: write
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry (PAT)
        if: env.GHCR_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Log in to Container Registry (GITHUB_TOKEN fallback)
        if: env.GHCR_TOKEN == ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract app metadata (main/tag)
        id: meta-app-main
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extract app metadata (dev)
        id: meta-app-dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=ref,event=branch

      - name: Extract nginx metadata (main/tag)
        id: meta-nginx-main
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extract nginx metadata (dev)
        id: meta-nginx-dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=ref,event=branch

      - name: Build app Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: pr-${{ github.event.number }}-app

      - name: Build nginx Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.nginx
          push: false
          tags: pr-${{ github.event.number }}-nginx

      - name: Build and push app Docker image (main/tag)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-app-main.outputs.tags }}
          labels: ${{ steps.meta-app-main.outputs.labels }}

      - name: Build and push app Docker image (dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-app-dev.outputs.tags }}
          labels: ${{ steps.meta-app-dev.outputs.labels }}

      - name: Build and push nginx Docker image (main/tag)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.nginx
          push: true
          tags: ${{ steps.meta-nginx-main.outputs.tags }}
          labels: ${{ steps.meta-nginx-main.outputs.labels }}

      - name: Build and push nginx Docker image (dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.nginx
          push: true
          tags: ${{ steps.meta-nginx-dev.outputs.tags }}
          labels: ${{ steps.meta-nginx-dev.outputs.labels }}
