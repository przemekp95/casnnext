name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  COVERAGE_MIN_LINES: '70'
  COVERAGE_EXCELLENT_LINES: '80'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: casn_test
          MYSQL_USER: casn_user
          MYSQL_PASSWORD: casn_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Clear TypeScript cache
        run: rm -rf node_modules/.cache tsconfig.tsbuildinfo tsconfig.ci.tsbuildinfo

      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"3306" --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL is ready!"

      - name: Run database migrations
        run: npm run migration:run
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test

      - name: Type check
        run: npm run type-check

      - name: Lint code
        run: npm run lint

      - name: Check posts
        run: npm run check:posts

      - name: Check CMS MDX media paths
        run: npm run check:cms-mdx-media

      - name: Enforce dependency audit policy
        run: npm run audit:policy
        env:
          AUDIT_FAIL_ON: high

      - name: Run unit tests with coverage
        run: npm run test:ci -- --coverage --watchAll=false
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build for E2E tests
        run: npm run build
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test

      - name: Run comprehensive integration tests
        run: |
          # Start Next.js server in background
          npm run start &
          SERVER_PID=$!

          # Wait for server to be ready (longer timeout)
          echo "Waiting for server to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:3000/api/health; do echo "Server not ready, waiting..."; sleep 3; done'
          echo "Server is ready!"

          # Give server a moment to fully initialize
          sleep 5

          # Verify server is still responding
          curl -f http://localhost:3000/api/health || (echo "Server health check failed" && exit 1)

          # Run live integration tests (DB + Next server)
          echo "Running live integration tests..."
          npm run test:integration:live

          # Run E2E tests including hydration tests
          echo "Starting E2E tests with hydration..."
          npm run test:e2e

          # Clean up server
          echo "Cleaning up server..."
          kill $SERVER_PID || true
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test
          PORT: 3000
          RUN_LIVE_TESTS: "1"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: |
            coverage/
            cypress/videos/
            cypress/screenshots/
          retention-days: 30

      - name: Comment PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const minCoverage = Number(process.env.COVERAGE_MIN_LINES || '70');
            const excellentCoverage = Number(process.env.COVERAGE_EXCELLENT_LINES || '80');

            let coverage = 'Not available';
            let coverageStatus = 'Unknown';

            if (fs.existsSync('coverage/coverage-summary.json')) {
              const coverageData = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const linesPct = Number(coverageData.total.lines.pct);

              coverage = `${linesPct}%`;
              coverageStatus =
                linesPct >= excellentCoverage
                  ? 'Excellent'
                  : linesPct >= minCoverage
                    ? 'Good'
                    : 'Low';
            }

            const jobStatus = '${{ job.status }}';
            const unitTests = jobStatus === 'success' ? 'Passed' : 'Failed';
            const e2eTests = jobStatus === 'success' ? 'Passed' : 'Failed';
            const qualityChecks = jobStatus === 'success' ? 'Passed' : 'Failed';

            const body = `## Test Results

            **Coverage:** ${coverageStatus} (${coverage})
            **Coverage Policy:** Good >= ${minCoverage}% | Excellent >= ${excellentCoverage}%
            **Unit Tests:** ${unitTests}
            **E2E Tests:** ${e2eTests}
            **Quality Checks:** ${qualityChecks}

            ---
            *Generated by CI/CD Pipeline*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  strapi-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: casn_test
          MYSQL_USER: casn_user
          MYSQL_PASSWORD: casn_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: strapi/package-lock.json

      - name: Install Strapi dependencies
        run: npm --prefix strapi ci

      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"3306" --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL is ready!"

      - name: Build Strapi admin
        run: npm --prefix strapi run build
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: 1337
          DATABASE_CLIENT: mysql
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: casn_test
          DATABASE_USERNAME: root
          DATABASE_PASSWORD: rootpassword
          STRAPI_URL: http://127.0.0.1:1337/cms
          STRAPI_ADMIN_PATH: /cms
          APP_KEYS: app-key-1,app-key-2,app-key-3,app-key-4
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          STRAPI_TELEMETRY_DISABLED: true

      - name: Run Strapi smoke tests
        run: bash scripts/ci/strapi-smoke.sh
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: 1337
          DATABASE_CLIENT: mysql
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: casn_test
          DATABASE_USERNAME: root
          DATABASE_PASSWORD: rootpassword
          STRAPI_URL: http://127.0.0.1:1337/cms
          STRAPI_ADMIN_PATH: /cms
          APP_KEYS: app-key-1,app-key-2,app-key-3,app-key-4
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          STRAPI_TELEMETRY_DISABLED: true

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, strapi-smoke]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (main/tag)
        id: meta-main
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extract metadata (dev)
        id: meta-dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=ref,event=branch

      - name: Build Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: pr-${{ github.event.number }}

      - name: Build and push Docker image (main/tag)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-main.outputs.tags }}
          labels: ${{ steps.meta-main.outputs.labels }}

      - name: Build and push Docker image (dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
