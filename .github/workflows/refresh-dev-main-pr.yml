name: Refresh dev->main integration PR

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-dev-main-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build integration branch from main + dev
        run: |
          git fetch origin main dev
          git checkout -B codex/dev-main-integration origin/main
          if ! git merge --no-edit -X theirs origin/dev; then
            echo "Merge reported conflicts. Resolving all unmerged paths in favor of origin/dev..."
            while IFS= read -r path; do
              if ! git checkout --theirs -- "$path" 2>/dev/null; then
                # If 'theirs' deleted the file, remove ours from index/worktree.
                git rm -f -- "$path" 2>/dev/null || true
              fi
              git add -- "$path"
            done < <(git diff --name-only --diff-filter=U)

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts remain after fallback:"
              git diff --name-only --diff-filter=U
              exit 1
            fi

            git commit --no-edit
          fi

      - name: Push refreshed integration branch
        run: |
          git push --force-with-lease origin codex/dev-main-integration

      - name: Create or update PR to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --base main --head codex/dev-main-integration --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base main \
              --head codex/dev-main-integration \
              --title "Dev (resolved integration branch)" \
              --body "Auto-refreshed integration PR generated on each push to dev."
          else
            gh pr edit "$pr_number" \
              --title "Dev (resolved integration branch)" \
              --body "Auto-refreshed integration PR generated on each push to dev."
          fi
