name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install immutable quality dependencies
        run: npm ci --ignore-scripts

      - name: Enforce lifecycle-safe preflight
        run: bash scripts/ci/first-party-quality-policy.sh .

      - name: Build runtime policy target
        run: npm run build:runtime

      - name: Lint code
        run: npm run lint

      - name: Enforce quality debt policy
        run: npm run quality:policy

  release:
    needs: [quality]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog from git commits since last tag
          echo "## Changes" > changelog.md
          echo "" >> changelog.md

          # Get commits since last tag (or all if no previous tags)
          if git describe --tags --abbrev=0 HEAD~ 2>/dev/null; then
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD~)
            git log --pretty=format:"- %s (%h)" "${LAST_TAG}..HEAD" >> changelog.md
          else
            git log --pretty=format:"- %s (%h)" --oneline >> changelog.md
          fi

          # Set output for use in release body (escape for multiline)
          CHANGELOG_CONTENT=$(cat changelog.md)
          CHANGELOG_CONTENT="${CHANGELOG_CONTENT//'%'/'%25'}"
          CHANGELOG_CONTENT="${CHANGELOG_CONTENT//$'\n'/'%0A'}"
          CHANGELOG_CONTENT="${CHANGELOG_CONTENT//$'\r'/'%0D'}"
          echo "changelog=$CHANGELOG_CONTENT" >> "$GITHUB_OUTPUT"

          rm changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 🚀 Release ${{ github.ref_name }}

            ${{ steps.changelog.outputs.changelog }}

            ### Deployment
            This workflow creates a source release only. It does not publish,
            pull, or deploy container images.

            To deploy, use the **Deploy to Production** workflow with immutable
            `app_image` and `nginx_image` digest references and the matching
            40-hex `app_revision`. See `docs/deployment.md`.

            ---
            **Generated by:** ${{ github.actor }}
            **Date:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
