name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout and setup
        uses: ./.github/actions/checkout-and-setup
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: ./.github/actions/generate-changelog
        id: changelog

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## 🚀 Release ${{ github.ref_name }}

            ${{ steps.changelog.outputs.changelog }}

            ### Docker Image
            \`\`\`bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            \`\`\`

            ### Deployment
            This release has been automatically deployed to production.

            ---
            **Generated by:** ${{ github.actor }}
            **Date:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}

      - name: Generate build artifacts
        run: |
          # Create a simple artifact with version info
          echo "CASN Release ${{ github.ref_name }}" > release-info.txt
          echo "Built on: $(date)" >> release-info.txt
          echo "Commit: ${{ github.sha }}" >> release-info.txt
          echo "Repository: ${{ github.repository }}" >> release-info.txt

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release-info.txt
          asset_name: release-info-${{ github.ref_name }}.txt
          asset_content_type: text/plain