name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: casn_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --default-authentication-plugin=mysql_native_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"3306" --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL is ready!"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma db push
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/casn_test

      - name: Type check
        run: npm run type-check

      - name: Lint code
        run: npm run lint

      - name: Check posts
        run: npm run check:posts

      - name: Run unit tests with coverage
        run: npm run test:ci -- --coverage --watchAll=false
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/casn_test

      - name: Check coverage threshold
        run: |
          COVERAGE=$(npx jest --coverage --coverageReporters=json-summary --watchAll=false | jq '.total.lines.pct')
          echo "Test coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "L Coverage below 80% minimum requirement"
            exit 1
          fi
          echo "✅ Coverage meets 80% minimum requirement"

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/casn_test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-test-results-${{ github.run_id }}
          path: |
            coverage/
            cypress/videos/
            cypress/screenshots/
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        if: env.DEPLOY_HOST
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/casn' }}

            # Pull latest docker-compose configuration
            git pull origin main

            # Pull latest Docker image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main

            # Deploy with docker-compose
            docker-compose -f docker-compose.portainer.yml down
            docker-compose -f docker-compose.portainer.yml up -d

            # Clean up old images
            docker image prune -f

      - name: Deploy via Portainer API
        if: env.PORTAINER_URL && !env.DEPLOY_HOST
        run: |
          echo "Deploying via Portainer API"
          # Here you would add Portainer API calls
          # Example:
          # curl -X POST ${{ secrets.PORTAINER_URL }}/api/stacks/webhooks/${{ secrets.PORTAINER_WEBHOOK_ID }}

      - name: Manual deployment notification
        if: ${{ !env.DEPLOY_HOST && !env.PORTAINER_URL }}
        run: |
          echo "Deployment Ready!"
          echo "Commit: ${{ github.sha }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          echo ""
          echo "Manual deployment steps:"
          echo "1. Pull latest code: git pull origin main"
          echo "2. Pull Docker image: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          echo "3. Deploy: docker-compose -f docker-compose.portainer.yml up -d"

      - name: Health check
        if: env.HEALTH_CHECK_URL
        run: |
          echo "Performing health check..."
          for i in {1..30}; do
            if curl -f -s ${{ secrets.HEALTH_CHECK_URL }} > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1

      - name: Notify deployment status
        if: always()
        run: |
          echo "Deployment finished with status: ${{ job.status }}"
          # Here you could add notifications to Slack, Discord, etc.
