name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      app_image:
        description: "Immutable app image (ghcr.io/...@sha256:...)"
        required: true
        type: string
      nginx_image:
        description: "Immutable nginx image (ghcr.io/...@sha256:...)"
        required: true
        type: string
      app_revision:
        description: "Full 40-hex app Git revision; must match this workflow ref and image label"
        required: true
        type: string
      operation:
        description: "Authenticate the remote Docker daemon only, or perform the full deployment"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - authenticate-only

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  COVERAGE_MIN_LINES: "70"
  COVERAGE_EXCELLENT_LINES: "80"

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install immutable quality dependencies
        run: npm ci --ignore-scripts

      - name: Enforce lifecycle-safe preflight
        run: bash scripts/ci/first-party-quality-policy.sh .

      - name: Build runtime policy target
        run: npm run build:runtime

      - name: Lint code
        run: npm run lint

      - name: Enforce quality debt policy
        run: npm run quality:policy

  test:
    needs: [quality]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: casn_test
          MYSQL_USER: casn_user
          MYSQL_PASSWORD: casn_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install snapshot test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Clear TypeScript cache
        run: rm -rf node_modules/.cache tsconfig.tsbuildinfo tsconfig.ci.tsbuildinfo

      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"3306" --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL is ready!"

      - name: Run database migrations
        run: npm run migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_NAME: casn_test
          RUN_DB_MIGRATIONS: "1"
          DB_MIGRATION_CONFIRM: RUN_CASN_MIGRATIONS

      - name: Type check
        run: npm run type-check

      - name: Check posts
        run: npm run check:posts

      - name: Check CMS MDX media paths
        run: npm run check:cms-mdx-media

      - name: Enforce dependency audit policy
        run: npm run audit:policy
        env:
          AUDIT_FAIL_ON_APP: high
          AUDIT_SUMMARY_FILE: ${{ github.step_summary }}

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test
          RUN_DB_MIGRATIONS: "1"
          DB_MIGRATION_CONFIRM: RUN_CASN_MIGRATIONS

      - name: Verify isolated runtime artifact
        run: npm run runtime:policy

      - name: Start application server
        run: |
          node server.cjs &
          echo $! > server.pid
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test
          PORT: 3000

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000/api/health --timeout 60000

      - name: Run unit tests with coverage
        run: npm run test:ci -- --coverage --watchAll=false
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test

      - name: Check coverage threshold
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "❌ Missing coverage/coverage-summary.json"
            exit 1
          fi

          COVERAGE=$(node -e "const s=require('./coverage/coverage-summary.json'); process.stdout.write(String(s.total.lines.pct));")
          echo "Test coverage (lines): ${COVERAGE}%"

          node -e "const c=Number(process.argv[1]); const min=Number(process.argv[2]); if (c < min) { console.error('❌ Coverage below minimum: ' + c + '% < ' + min + '%'); process.exit(1); }" "$COVERAGE" "$COVERAGE_MIN_LINES"
          node -e "const c=Number(process.argv[1]); const target=Number(process.argv[2]); if (c < target) { console.log('⚠ Coverage above minimum but below target: ' + c + '% < ' + target + '%'); } else { console.log('✅ Coverage meets target: ' + c + '% >= ' + target + '%'); }" "$COVERAGE" "$COVERAGE_EXCELLENT_LINES"

      - name: Run live integration tests
        run: npm run test:integration:live
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test
          RUN_LIVE_TESTS: "1"

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test

      - name: Stop application server
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
            rm server.pid
          fi
        if: always()

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-test-results-${{ github.run_id }}
          path: |
            coverage/
            cypress/videos/
            cypress/screenshots/
          retention-days: 30

  directus-smoke:
    needs: [quality]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: casn_test
          MYSQL_USER: casn_user
          MYSQL_PASSWORD: casn_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"3306" --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL is ready!"

      - name: Run database migrations
        run: npm run migration:run
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test

      - name: Run Directus smoke tests
        run: npm run directus:smoke
        env:
          DIRECTUS_DB_HOST: 127.0.0.1
          DIRECTUS_DB_PORT: 3306
          DIRECTUS_DB_NAME: casn_test
          DIRECTUS_DB_USER: root
          DIRECTUS_DB_PASSWORD: rootpassword

  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [quality, test, directus-smoke]
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      APP_IMAGE: ${{ inputs.app_image }}
      NGINX_IMAGE: ${{ inputs.nginx_image }}
      APP_REVISION: ${{ inputs.app_revision }}
      EXPECTED_APP_REVISION: ${{ github.sha }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GHCR_USERNAME: ${{ github.repository_owner }}
      DEPLOY_OPERATION: ${{ inputs.operation }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate immutable deployment artifacts
        shell: bash
        run: |
          set -euo pipefail
          validation_env="$(mktemp)"
          trap 'rm -f "$validation_env"' EXIT
          chmod 600 "$validation_env"
          scripts/deploy/write-artifact-env.sh "$validation_env"

          app_repository="ghcr.io/${GITHUB_REPOSITORY,,}@sha256:"
          nginx_repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/casn-nginx@sha256:"
          if [[ "$APP_IMAGE" != "$app_repository"* ]]; then
            echo 'APP_IMAGE does not belong to the application repository.' >&2
            exit 1
          fi
          if [[ "$NGINX_IMAGE" != "$nginx_repository"* ]]; then
            echo 'NGINX_IMAGE does not belong to the nginx repository.' >&2
            exit 1
          fi

          docker pull "$APP_IMAGE"
          docker pull "$NGINX_IMAGE"

          app_image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$APP_IMAGE")"
          nginx_image_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$NGINX_IMAGE")"
          if [[ "$app_image_revision" != "$APP_REVISION" ]]; then
            echo 'APP_REVISION does not match the app image OCI revision label.' >&2
            exit 1
          fi
          if [[ "$nginx_image_revision" != "$APP_REVISION" ]]; then
            echo 'APP_REVISION does not match the nginx image OCI revision label.' >&2
            exit 1
          fi

      - name: Deploy via SSH
        if: ${{ env.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_IMAGE: ${{ env.APP_IMAGE }}
          NGINX_IMAGE: ${{ env.NGINX_IMAGE }}
          APP_REVISION: ${{ env.APP_REVISION }}
          EXPECTED_APP_REVISION: ${{ env.EXPECTED_APP_REVISION }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/casn' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: APP_IMAGE,NGINX_IMAGE,APP_REVISION,EXPECTED_APP_REVISION,GHCR_TOKEN,GHCR_USERNAME,DEPLOY_OPERATION,DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"

            if [ "$DEPLOY_OPERATION" = "authenticate-only" ]; then
              scripts/deploy/login-registry.sh
              echo "Remote GHCR authentication completed; deployment intentionally skipped."
              exit 0
            fi

            git fetch --depth=1 origin "$APP_REVISION"
            remote_deploy_script="$(mktemp)"
            health_verifier_script="$(mktemp)"
            trap 'rm -f "$remote_deploy_script" "$health_verifier_script"' EXIT
            git show "$APP_REVISION:scripts/deploy/remote-deploy.sh" >"$remote_deploy_script"
            git show "$APP_REVISION:scripts/deploy/verify-health.sh" >"$health_verifier_script"
            chmod 700 "$remote_deploy_script" "$health_verifier_script"
            HEALTH_VERIFIER="$health_verifier_script" "$remote_deploy_script"

      - name: Reject unimplemented Portainer-only deployment
        if: ${{ env.PORTAINER_URL != '' && env.DEPLOY_HOST == '' }}
        run: |
          echo 'Portainer-only deployment cannot safely inject the validated immutable artifact environment.' >&2
          exit 1

      - name: Manual deployment notification
        if: ${{ env.DEPLOY_HOST == '' && env.PORTAINER_URL == '' }}
        run: |
          echo "Deployment Ready!"
          echo "Commit: $APP_REVISION"
          echo "App image: $APP_IMAGE"
          echo "Directus image: directus/directus:12.3.1@sha256:8978edf633ae28aa31464bb71c55300c94d8bc771ff3727b5fac485173283869"
          echo "Nginx image: $NGINX_IMAGE"
          echo ""
          echo "Manual deployment steps:"
          echo "1. Check out commit: $APP_REVISION"
          echo '2. Authenticate to GHCR with a read:packages token via scripts/deploy/login-registry.sh'
          echo '3. Preserve existing secrets and set APP_IMAGE, NGINX_IMAGE, and APP_REVISION in .env'
          echo '4. Validate: docker compose --env-file .env -f docker-compose.portainer.yml config --quiet'
          echo '5. Pull the exact app/nginx references printed above'
          echo '6. Run the exact revision scripts/deploy/remote-deploy.sh with DEPLOY_PATH and HEALTH_VERIFIER=scripts/deploy/verify-health.sh'
          echo '7. If the internal exact-revision gate fails, the script restores and verifies the previous immutable release'
          echo '8. Independently verify the canonical public health JSON reports the exact deployed revision'

      - name: Health check
        if: ${{ inputs.operation == 'deploy' && env.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_REVISION: ${{ env.APP_REVISION }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: APP_REVISION
          script: |
            set -eu
            cd ${{ secrets.DEPLOY_PATH || '/opt/casn' }}
            scripts/deploy/verify-health.sh "$APP_REVISION"

      - name: Notify deployment status
        if: always()
        run: |
          echo "Deployment finished with status: ${{ job.status }}"
          # Here you could add notifications to Slack, Discord, etc.
