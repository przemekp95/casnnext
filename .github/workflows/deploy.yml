name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  COVERAGE_MIN_LINES: '70'
  COVERAGE_EXCELLENT_LINES: '80'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: casn_test
          MYSQL_USER: casn_user
          MYSQL_PASSWORD: casn_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Clear TypeScript cache
        run: rm -rf node_modules/.cache tsconfig.tsbuildinfo tsconfig.ci.tsbuildinfo

      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"3306" --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL is ready!"

      - name: Run database migrations
        run: npm run migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_NAME: casn_test

      - name: Type check
        run: npm run type-check

      - name: Lint code
        run: npm run lint

      - name: Check posts
        run: npm run check:posts

      - name: Check CMS MDX media paths
        run: npm run check:cms-mdx-media

      - name: Enforce dependency audit policy
        run: npm run audit:policy
        env:
          AUDIT_FAIL_ON_APP: high
          AUDIT_FAIL_ON_STRAPI: high
          AUDIT_SUMMARY_FILE: ${{ github.step_summary }}

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test

      - name: Start application server
        run: |
          npm start &
          echo $! > server.pid
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test
          PORT: 3000

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000/api/health --timeout 60000

      - name: Run unit tests with coverage
        run: npm run test:ci -- --coverage --watchAll=false
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test

      - name: Check coverage threshold
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "❌ Missing coverage/coverage-summary.json"
            exit 1
          fi

          COVERAGE=$(node -e "const s=require('./coverage/coverage-summary.json'); process.stdout.write(String(s.total.lines.pct));")
          echo "Test coverage (lines): ${COVERAGE}%"

          node -e "const c=Number(process.argv[1]); const min=Number(process.argv[2]); if (c < min) { console.error('❌ Coverage below minimum: ' + c + '% < ' + min + '%'); process.exit(1); }" "$COVERAGE" "$COVERAGE_MIN_LINES"
          node -e "const c=Number(process.argv[1]); const target=Number(process.argv[2]); if (c < target) { console.log('⚠ Coverage above minimum but below target: ' + c + '% < ' + target + '%'); } else { console.log('✅ Coverage meets target: ' + c + '% >= ' + target + '%'); }" "$COVERAGE" "$COVERAGE_EXCELLENT_LINES"

      - name: Run live integration tests
        run: npm run test:integration:live
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test
          RUN_LIVE_TESTS: "1"

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: mysql://root:rootpassword@localhost:3306/casn_test

      - name: Stop application server
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi
        if: always()

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-test-results-${{ github.run_id }}
          path: |
            coverage/
            cypress/videos/
            cypress/screenshots/
          retention-days: 30

  strapi-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: casn_test
          MYSQL_USER: casn_user
          MYSQL_PASSWORD: casn_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: strapi/package-lock.json

      - name: Install Strapi dependencies
        run: npm --prefix strapi ci

      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"3306" --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL is ready!"

      - name: Build Strapi admin
        run: npm --prefix strapi run build
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: 1337
          DATABASE_CLIENT: mysql
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: casn_test
          DATABASE_USERNAME: root
          DATABASE_PASSWORD: rootpassword
          STRAPI_URL: http://127.0.0.1:1337/cms
          STRAPI_ADMIN_PATH: /cms
          APP_KEYS: app-key-1,app-key-2,app-key-3,app-key-4
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          STRAPI_TELEMETRY_DISABLED: true

      - name: Run Strapi smoke tests
        run: bash scripts/ci/strapi-smoke.sh
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: 1337
          DATABASE_CLIENT: mysql
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: casn_test
          DATABASE_USERNAME: root
          DATABASE_PASSWORD: rootpassword
          STRAPI_URL: http://127.0.0.1:1337/cms
          STRAPI_ADMIN_PATH: /cms
          APP_KEYS: app-key-1,app-key-2,app-key-3,app-key-4
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          STRAPI_TELEMETRY_DISABLED: true

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: [test, strapi-smoke]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        if: env.DEPLOY_HOST
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/casn' }}

            # Pull latest docker-compose configuration
            git pull origin main

            # Pull latest Docker image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main

            # Deploy with docker-compose
            docker-compose -f docker-compose.portainer.yml down
            docker-compose -f docker-compose.portainer.yml up -d

            # Clean up old images
            docker image prune -f

      - name: Deploy via Portainer API
        if: env.PORTAINER_URL && !env.DEPLOY_HOST
        run: |
          echo "Deploying via Portainer API"
          # Here you would add Portainer API calls
          # Example:
          # curl -X POST ${{ secrets.PORTAINER_URL }}/api/stacks/webhooks/${{ secrets.PORTAINER_WEBHOOK_ID }}

      - name: Manual deployment notification
        if: ${{ !env.DEPLOY_HOST && !env.PORTAINER_URL }}
        run: |
          echo "Deployment Ready!"
          echo "Commit: ${{ github.sha }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          echo ""
          echo "Manual deployment steps:"
          echo "1. Pull latest code: git pull origin main"
          echo "2. Pull Docker image: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          echo "3. Deploy: docker-compose -f docker-compose.portainer.yml up -d"

      - name: Health check
        if: env.HEALTH_CHECK_URL
        run: |
          echo "Performing health check..."
          for i in {1..30}; do
            if curl -f -s ${{ secrets.HEALTH_CHECK_URL }} > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1

      - name: Notify deployment status
        if: always()
        run: |
          echo "Deployment finished with status: ${{ job.status }}"
          # Here you could add notifications to Slack, Discord, etc.
