name: Diagnose production health URL

on:
  push:
    branches:
      - codex/fix-production-health-gate

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
    steps:
      - name: Classify URL and probe without disclosure
        shell: bash
        run: |
          set -euo pipefail
          canonical_url='https://casn.pl/api/health'

          node <<'NODE'
          const secret = process.env.HEALTH_CHECK_URL ?? '';
          const canonical = 'https://casn.pl/api/health';
          let parsed;
          try {
            parsed = new URL(secret);
          } catch {
            console.log('secret_url_parseable=false');
            process.exit(0);
          }

          console.log('secret_url_parseable=true');
          console.log(`secret_exact_canonical=${secret === canonical}`);
          console.log(`secret_trimmed_canonical=${secret.trim() === canonical}`);
          console.log(`secret_host_category=${parsed.hostname === 'casn.pl' ? 'casn.pl' : parsed.hostname === 'www.casn.pl' ? 'www.casn.pl' : 'other'}`);
          console.log(`secret_path_category=${parsed.pathname === '/api/health' ? 'api-health' : parsed.pathname === '/api/health/live' ? 'api-health-live' : parsed.pathname === '/health' ? 'health' : parsed.pathname === '/nginx-health' ? 'nginx-health' : parsed.pathname === '/' ? 'root' : 'other'}`);
          console.log(`secret_https=${parsed.protocol === 'https:'}`);
          console.log(`secret_has_query=${parsed.search !== ''}`);
          console.log(`secret_has_fragment=${parsed.hash !== ''}`);
          NODE

          secret_headers="$(mktemp)"
          canonical_headers="$(mktemp)"
          canonical_body="$(mktemp)"
          trap 'rm -f "$secret_headers" "$canonical_headers" "$canonical_body"' EXIT

          secret_status="$(curl --silent --show-error --max-time 15 --output /dev/null --dump-header "$secret_headers" --write-out '%{http_code}' "$HEALTH_CHECK_URL" || true)"
          canonical_status="$(curl --silent --show-error --max-time 15 --output "$canonical_body" --dump-header "$canonical_headers" --write-out '%{http_code}' "$canonical_url" || true)"
          echo "secret_http_status=$secret_status"
          echo "canonical_http_status=$canonical_status"

          if grep -Eiq '^server:[[:space:]]*cloudflare[[:space:]]*$' "$secret_headers"; then
            echo 'secret_server_category=cloudflare'
          else
            echo 'secret_server_category=other-or-absent'
          fi
          if grep -Eiq '^server:[[:space:]]*cloudflare[[:space:]]*$' "$canonical_headers"; then
            echo 'canonical_server_category=cloudflare'
          else
            echo 'canonical_server_category=other-or-absent'
          fi
          if grep -Eiq '^cf-mitigated:[[:space:]]*challenge[[:space:]]*$' "$canonical_headers" \
            || grep -Eiq 'cf-chl|attention required.*cloudflare|just a moment' "$canonical_body"; then
            echo 'canonical_cloudflare_challenge=true'
          else
            echo 'canonical_cloudflare_challenge=false'
          fi

          probe_status() {
            local label="$1"
            shift
            local status
            status="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$@" "$canonical_url" || true)"
            echo "${label}_http_status=$status"
          }

          probe_status accept_json --header 'Accept: application/json'
          probe_status browser_user_agent --user-agent 'Mozilla/5.0 (compatible; CASN-Deployment-Health/1.0)'
          probe_status browser_user_agent_accept_json \
            --user-agent 'Mozilla/5.0 (compatible; CASN-Deployment-Health/1.0)' \
            --header 'Accept: application/json'
