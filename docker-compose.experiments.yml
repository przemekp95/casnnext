# EXPERIMENTS ENVIRONMENT: With database seeding enabled
# For testing seeding functionality

version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: casn-mysql-experiments
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: casn
      MYSQL_USER: casn_user
      MYSQL_PASSWORD: casn_password123
      TZ: Europe/Warsaw
    volumes:
      - mysql_experiments_data:/var/lib/mysql
      - ./casn.sql:/docker-entrypoint-initdb.d/casn.sql:ro  # ENABLED seeding for experiments
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "3307:3306"  # Different port to avoid conflict
    networks:
      - casn-experiments-network

  app:
    image: ghcr.io/przemekp95/casnnext:main
    container_name: casn-app-experiments
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: "mysql://casn_user:casn_password123@mysql:3306/casn"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: casn_user
      DB_PASSWORD: casn_password123
      DB_NAME: casn
      NEXTAUTH_SECRET: "your-secret-key-here"
      NEXTAUTH_URL: "http://localhost:3002"  # Different port
      TZ: Europe/Warsaw
    command: ["npm", "start"]
    ports:
      - "3002:3000"  # Different port
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - casn-experiments-network

volumes:
  mysql_experiments_data:

networks:
  casn-experiments-network:
    driver: bridge