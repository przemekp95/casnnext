pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream nextjs {
        server app:3000;
    }

    upstream directus {
        server directus:8055;
    }

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;

        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location = /cms {
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 308 /cms/;
        }

        # Preserve read-only access to files from the legacy Strapi volume.
        location ^~ /cms/uploads/ {
            alias /legacy-strapi-uploads/;
            autoindex off;
            access_log off;
            expires 30d;
            add_header X-Robots-Tag "noindex, nofollow" always;

            limit_except GET {
                deny all;
            }
        }

        # Directus admin, API and new assets are exposed below /cms/.
        location ^~ /cms/ {
            add_header X-Robots-Tag "noindex, nofollow" always;
            rewrite ^/cms/(.*)$ /$1 break;
            proxy_pass http://directus;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /cms;
            proxy_cache_bypass $http_upgrade;
        }

        # All non-CMS public traffic remains owned by Next.js.
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
