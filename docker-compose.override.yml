# Override to skip problematic entrypoint script
version: "3.8"

services:
  app:
    image: ghcr.io/przemekp95/casnnext:main
    container_name: casn-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "mysql://casn_user:casn_password123@mysql:3306/casn"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: casn_user
      DB_PASSWORD: casn_password123
      DB_NAME: casn
      NEXTAUTH_SECRET: "your-secret-key-here"
      NEXTAUTH_URL: "http://localhost:3001"
      TZ: Europe/Warsaw
    # Override entrypoint to skip docker-entrypoint.sh entirely
    command: ["npm", "start"]
    entrypoint: ["npm", "start"]  # This overrides the ENTRYPOINT in Dockerfile
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - casn-network