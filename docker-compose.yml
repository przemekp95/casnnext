version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: casn-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: casn
      MYSQL_USER: casn_user
      MYSQL_PASSWORD: casn_password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./casn.sql:/docker-entrypoint-initdb.d/casn.sql
    networks:
      - casn-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Next.js Application
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: casn-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://casn_user:casn_password123@mysql:3306/casn
      - NEXTAUTH_SECRET=your-secret-key-here
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - casn-network
    volumes:
      - ./public:/app/public:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      timeout: 10s
      retries: 3
      interval: 30s

  # Database GUI - phpMyAdmin (for Prisma/MySQL management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: casn-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: casn_user
      PMA_PASSWORD: casn_password123
      UPLOAD_LIMIT: 50M
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - casn-network

volumes:
  mysql_data:
    driver: local

networks:
  casn-network:
    driver: bridge
