services:
  mysql:
    image: mysql:8.0
    container_name: casn-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?MYSQL_DATABASE is required}"
      MYSQL_USER: "${MYSQL_USER:?MYSQL_USER is required}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
      TZ: Europe/Warsaw
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - casn-network

  directus:
    image: directus/directus:12.3.1@sha256:8978edf633ae28aa31464bb71c55300c94d8bc771ff3727b5fac485173283869
    container_name: casn-directus
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      KEY: "${DIRECTUS_KEY:?DIRECTUS_KEY is required}"
      SECRET: "${DIRECTUS_SECRET:?DIRECTUS_SECRET is required}"
      ADMIN_EMAIL: "${DIRECTUS_ADMIN_EMAIL:?DIRECTUS_ADMIN_EMAIL is required}"
      ADMIN_PASSWORD: "${DIRECTUS_ADMIN_PASSWORD:?DIRECTUS_ADMIN_PASSWORD is required}"
      DB_CLIENT: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${MYSQL_DATABASE:?MYSQL_DATABASE is required}"
      DB_USER: "${MYSQL_USER:?MYSQL_USER is required}"
      DB_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
      PUBLIC_URL: "${DIRECTUS_PUBLIC_URL:-http://localhost:3001/cms}"
      DIRECTUS_INTERNAL_URL: http://127.0.0.1:8055
      DIRECTUS_REVALIDATE_URL: http://app:3000/api/revalidate
      REVALIDATE_SECRET: "${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}"
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      TZ: Europe/Warsaw
    volumes:
      - directus_uploads:/directus/uploads
      - ./directus/bootstrap.cjs:/directus/bootstrap.cjs:ro
      - ./directus/start.sh:/directus/start.sh:ro
      - ./directus/extensions/directus-extension-casn-field-guard:/directus/extensions/directus-extension-casn-field-guard:ro
    command: ["sh", "/directus/start.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'test -f /directus/.casn_bootstrapped && node -e "fetch(''http://127.0.0.1:8055/server/ping'').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - casn-network

  app:
    image: "${APP_IMAGE:?APP_IMAGE is required}"
    container_name: casn-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: "${MYSQL_USER:?MYSQL_USER is required}"
      DB_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
      DB_NAME: "${MYSQL_DATABASE:?MYSQL_DATABASE is required}"
      DB_POOL_SIZE: "5"
      REVALIDATE_SECRET: "${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}"
      NEXTAUTH_URL: "${APP_PUBLIC_URL:-http://localhost:3001}"
      NEXT_TELEMETRY_DISABLED: "1"
      APP_REVISION: "${APP_REVISION:?APP_REVISION is required}"
      TZ: Europe/Warsaw
    command: ["node", "server.cjs"]
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - casn-network

  nginx:
    image: "${NGINX_IMAGE:?NGINX_IMAGE is required}"
    container_name: casn-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      directus:
        condition: service_healthy
    volumes:
      - strapi_uploads:/legacy-strapi-uploads:ro
    ports:
      - "3001:8080"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - casn-network

volumes:
  mysql_data:
  directus_uploads:
  strapi_uploads:

networks:
  casn-network:
    driver: bridge
