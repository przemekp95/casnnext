# FINAL SOLUTION: Eliminate Migration Service Completely
# Uses docker-entrypoint.sh for automatic migrations

version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: casn-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: casn
      MYSQL_USER: casn_user
      MYSQL_PASSWORD: casn_password123
      TZ: Europe/Warsaw
    volumes:
      - mysql_data:/var/lib/mysql
      - ./casn.sql:/docker-entrypoint-initdb.d/casn.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "3306:3306"
    networks:
      - casn-network

  app:
    image: ghcr.io/przemekp95/casnnext:main
    container_name: casn-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"                    # Fixed: Next.js runs on internal port 3000
      DATABASE_URL: "mysql://casn_user:casn_password123@mysql:3306/casn"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: casn_user
      DB_PASSWORD: casn_password123
      DB_NAME: casn
      NEXTAUTH_SECRET: "your-secret-key-here"
      NEXTAUTH_URL: "http://localhost:3001"  # Fixed: External URL uses port 3001
      TZ: Europe/Warsaw
    command: ["npm", "start"]  # Override entrypoint to skip migrations since DB is initialized from SQL
    ports:
      - "3001:3000"                # Fixed: Host port 3001, Container port 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]  # Fixed: Test internal port 3000
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - casn-network
    # volumes:
    #   - ./public:/app/public:ro  # REMOVED - public files are already in the image

volumes:
  mysql_data:

networks:
  casn-network:
    driver: bridge